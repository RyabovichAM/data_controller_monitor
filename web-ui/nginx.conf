server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One origin for everything the browser needs: the bundle, the REST API and
    # the live feed. Nothing has to be told where the backend is, and there is
    # no CORS to arrange.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # The feed is quiet between samples; without this nginx would drop the
        # socket after a minute of silence.
        proxy_read_timeout 1h;
    }

    # A single page application: unknown paths are its own routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
