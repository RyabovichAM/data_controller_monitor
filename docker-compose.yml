services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcm
      POSTGRES_PASSWORD: dcm
      POSTGRES_DB: dcm_config
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcm -d dcm_config"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - config-db:/var/lib/postgresql/data

  config-service:
    build:
      context: .
      dockerfile: services/config-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_SERVICE_ADDRESS: 0.0.0.0:50051
      POSTGRES_DSN: postgresql://dcm:dcm@postgres:5432/dcm_config
    # The port is not published: collector and backend reach the service inside
    # the compose network. For debugging from the host add a published port in
    # a compose override.

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: sensor-data
      KAFKA_GROUP_ID: storage-service
      STORAGE_ROOT: /data
      STORAGE_FORMAT: text
      STORAGE_PERIOD_MS: "0"
      # Serves the history over gRPC. Like config-service, the port stays
      # inside the compose network: the backend is the only caller.
      STORAGE_SERVICE_ADDRESS: 0.0.0.0:50052
    volumes:
      - storage-data:/data

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      config-service:
        condition: service_started
    # Transport and Kafka settings come from config-service. Until a config is
    # saved for this COLLECTOR_ID the collector idles on its WatchConfig stream
    # and starts collecting the moment one appears.
    environment:
      COLLECTOR_ID: collector-1
      CONFIG_SERVICE_ADDRESS: config-service:50051
    ports:
      - "2323:2323"

volumes:
  storage-data:
  config-db:
